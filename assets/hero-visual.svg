<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726"/>
      <stop offset="100%" stop-color="#0a0c16"/>
    </linearGradient>

    <!-- Ambient glow -->
    <radialGradient id="hero-cyan-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hero-purple-glow" cx="80%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hero-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.2)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <pattern id="hero-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <!-- Ambient Light Fields -->
  <rect width="680" height="480" fill="url(#hero-cyan-glow)"/>
  <rect width="680" height="480" fill="url(#hero-purple-glow)"/>

  <!-- Main Tech Console Container -->
  <rect x="20" y="20" width="640" height="440" rx="20" fill="url(#hero-card-bg)"/>
  <rect x="20" y="20" width="640" height="440" rx="20" stroke="url(#hero-border)" stroke-width="1.5"/>
  <rect x="20" y="20" width="640" height="440" rx="20" fill="url(#hero-dots)"/>

  <!-- Console Top Window Header -->
  <g transform="translate(44, 42)">
    <!-- Window action dots -->
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="16" cy="0" r="4.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="32" cy="0" r="4.5" fill="#10b981" opacity="0.8"/>

    <!-- Console Title -->
    <text x="56" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="0.08em">
      ELANOVA // STUDIO DUAL ARCHITECTURE CORE
    </text>

    <!-- Status pill -->
    <g transform="translate(480, -9)">
      <rect width="112" height="22" rx="11" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.28)" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#10b981"/>
      <text x="22" y="14.5" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="9.5" font-weight="700" fill="#34d399" letter-spacing="0.06em">ENGINE ACTIVE</text>
    </g>
  </g>

  <!-- Divider line -->
  <line x1="44" y1="72" x2="636" y2="72" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- LEFT PILLAR: MOBILE APPS ARCHITECTURE (Prime Focus Timer & Utility) -->
  <g transform="translate(48, 96)">
    <!-- Sub-card container -->
    <rect width="260" height="336" rx="14" fill="#0c0e18" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2"/>

    <!-- Module Header -->
    <g transform="translate(18, 22)">
      <rect width="24" height="24" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
      <!-- Mobile icon -->
      <path d="M7 5 H17 C17.6 5 18 5.4 18 6 V18 C18 18.6 17.6 19 17 19 H7 C6.4 19 6 18.6 6 18 V6 C6 5.4 6.4 5 7 5 Z" stroke="#38bdf8" stroke-width="1.3" fill="none"/>
      <line x1="11" y1="16.5" x2="13" y2="16.5" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round"/>
      <text x="32" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">APP ECOSYSTEM</text>
      <text x="32" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">Utility • Routine • Offline-First</text>
    </g>

    <!-- Mobile Device Preview Mockup Wireframe -->
    <g transform="translate(45, 66)">
      <!-- Phone Bezel -->
      <rect width="170" height="216" rx="18" fill="#121626" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
      <!-- Camera Notch Pill -->
      <rect x="65" y="6" width="40" height="4" rx="2" fill="#080a12"/>

      <!-- App Screen Content (Focus Session) -->
      <g transform="translate(16, 24)">
        <!-- Session Card -->
        <rect width="138" height="34" rx="8" fill="#1a1f36"/>
        <text x="12" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8">SESSION TIMER</text>
        <text x="12" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">25:00.00</text>
        <circle cx="124" cy="17" r="4" fill="#10b981"/>

        <!-- Circular Focus Dial Graphic -->
        <g transform="translate(69, 86)">
          <circle cx="0" cy="0" r="38" stroke="rgba(255, 255, 255, 0.08)" stroke-width="5" fill="none"/>
          <circle cx="0" cy="0" r="38" stroke="url(#brand-grad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="65" transform="rotate(-90)" fill="none"/>
          <text text-anchor="middle" y="4" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#f8fafc">18:42</text>
          <text text-anchor="middle" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#94a3b8">DEEP WORK</text>
        </g>

        <!-- Metric rows -->
        <g transform="translate(0, 142)">
          <rect width="64" height="24" rx="6" fill="#151a2e"/>
          <text x="8" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#64748b">STREAK</text>
          <text x="8" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f8fafc">14 DAYS</text>

          <rect x="74" width="64" height="24" rx="6" fill="#151a2e"/>
          <text x="82" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#64748b">DATA</text>
          <text x="82" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34d399">OFFLINE</text>
        </g>
      </g>
    </g>

    <!-- Bottom Tech Spec -->
    <text x="20" y="318" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8">
      &gt; FEATURED: PRIME FOCUS v1.1.7
    </text>
  </g>

  <!-- RIGHT PILLAR: GAME DEVELOPMENT (Car Blast & IT-Empire) -->
  <g transform="translate(368, 96)">
    <!-- Sub-card container -->
    <rect width="260" height="336" rx="14" fill="#0e0c1a" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.2"/>

    <!-- Module Header -->
    <g transform="translate(18, 22)">
      <rect width="24" height="24" rx="6" fill="rgba(168, 85, 247, 0.15)"/>
      <!-- Game Controller icon -->
      <path d="M6 9 C6 7.3 7.3 6 9 6 H15 C16.7 6 18 7.3 18 9 V13 C18 16 15 18 13.5 18 L12 17 L10.5 18 C9 18 6 16 6 13 V9 Z" stroke="#c084fc" stroke-width="1.3" fill="none"/>
      <line x1="9" y1="10" x2="9" y2="13" stroke="#c084fc" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="7.5" y1="11.5" x2="10.5" y2="11.5" stroke="#c084fc" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="15" cy="11.5" r="1" fill="#c084fc"/>
      <text x="32" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">GAME LABS</text>
      <text x="32" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">Arcade • Strategy • Mechanics</text>
    </g>

    <!-- Game Pipeline View -->
    <g transform="translate(20, 66)">
      <!-- Game 1 Mini Node: Car Blast -->
      <rect width="220" height="95" rx="10" fill="#141126" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1"/>
      <g transform="translate(14, 18)">
        <rect width="36" height="36" rx="8" fill="#201a3b"/>
        <!-- Mini arcade grid icon -->
        <rect x="7" y="7" width="9" height="9" rx="2" fill="#38bdf8"/>
        <rect x="20" y="7" width="9" height="9" rx="2" fill="#a855f7"/>
        <rect x="7" y="20" width="9" height="9" rx="2" fill="#f59e0b"/>
        <rect x="20" y="20" width="9" height="9" rx="2" fill="#38bdf8"/>

        <text x="46" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Car Blast</text>
        <text x="46" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94a3b8">Arcade Vehicle Grid Cleared</text>

        <!-- Status Tag -->
        <rect x="0" y="48" width="86" height="18" rx="9" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
        <circle cx="8" cy="57" r="3" fill="#f59e0b"/>
        <text x="16" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#fbbf24">IN DEV</text>
      </g>

      <!-- Game 2 Mini Node: IT-Empire -->
      <g transform="translate(0, 112)">
        <rect width="220" height="95" rx="10" fill="#0e172a" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
        <g transform="translate(14, 18)">
          <rect width="36" height="36" rx="8" fill="#13233c"/>
          <!-- Mini server tower icon -->
          <rect x="10" y="8" width="16" height="6" rx="1.5" fill="#38bdf8"/>
          <rect x="10" y="16" width="16" height="6" rx="1.5" fill="#38bdf8" opacity="0.7"/>
          <rect x="10" y="24" width="16" height="6" rx="1.5" fill="#10b981"/>

          <text x="46" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">IT-Empire</text>
          <text x="46" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94a3b8">Tech Tycoon Simulation</text>

          <!-- Status Tag -->
          <rect x="0" y="48" width="86" height="18" rx="9" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
          <circle cx="8" cy="57" r="3" fill="#f59e0b"/>
          <text x="16" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#fbbf24">IN DEV</text>
        </g>
      </g>
    </g>

    <!-- Bottom Tech Spec -->
    <text x="20" y="318" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c084fc">
      &gt; ACTIVE REPOSITORIES: 2 TITLES
    </text>
  </g>

  <!-- CENTER BRIDGE: INTERCONNECT ARTERY -->
  <g transform="translate(308, 230)">
    <!-- Bridge connection lines -->
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#brand-grad)" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="30" cy="0" r="14" fill="#090a10" stroke="url(#brand-grad)" stroke-width="2"/>
    <circle cx="30" cy="0" r="5" fill="#38bdf8"/>
  </g>
</svg>

