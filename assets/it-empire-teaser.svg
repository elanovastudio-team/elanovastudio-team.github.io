<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ite-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="ite-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1"/>
    </pattern>

    <linearGradient id="ite-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="server-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="16" fill="url(#ite-bg)"/>
  <rect width="600" height="340" rx="16" fill="url(#ite-grid)"/>

  <!-- Radial Ambience Glow -->
  <ellipse cx="300" cy="160" rx="200" ry="100" fill="url(#ite-glow)"/>

  <!-- Isometric Tech Infrastructure / Server Cluster -->
  <g transform="translate(140, 35)">
    <!-- Base Platform Grid -->
    <path d="M 160 30 L 300 110 L 160 190 L 20 110 Z" fill="#0b1322" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
    <path d="M 90 70 L 230 150 M 20 110 L 160 190 M 230 70 L 90 150" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

    <!-- Central Server Tower 1 (Tall) -->
    <g transform="translate(125, 45)">
      <!-- Top Face -->
      <path d="M 35 0 L 70 20 L 35 40 L 0 20 Z" fill="#334155"/>
      <!-- Left Face -->
      <path d="M 0 20 L 35 40 L 35 105 L 0 85 Z" fill="#1e293b"/>
      <!-- Right Face -->
      <path d="M 35 40 L 70 20 L 70 85 L 35 105 Z" fill="#0f172a"/>
      <!-- Server Rack Blinking LED Slots -->
      <line x1="8" y1="40" x2="28" y2="52" stroke="#38bdf8" stroke-width="2"/>
      <line x1="8" y1="55" x2="28" y2="67" stroke="#38bdf8" stroke-width="2"/>
      <line x1="8" y1="70" x2="28" y2="82" stroke="#10b981" stroke-width="2"/>
      
      <circle cx="48" cy="45" r="2" fill="#10b981"/>
      <circle cx="58" cy="40" r="2" fill="#38bdf8"/>
      <circle cx="48" cy="60" r="2" fill="#10b981"/>
      <circle cx="58" cy="55" r="2" fill="#38bdf8"/>
    </g>

    <!-- Server Tower 2 (Medium Left) -->
    <g transform="translate(60, 75)">
      <!-- Top -->
      <path d="M 28 0 L 56 16 L 28 32 L 0 16 Z" fill="#334155"/>
      <!-- Left -->
      <path d="M 0 16 L 28 32 L 28 80 L 0 64 Z" fill="#1e293b"/>
      <!-- Right -->
      <path d="M 28 32 L 56 16 L 56 64 L 28 80 Z" fill="#0f172a"/>
      <!-- LED indicators -->
      <line x1="6" y1="32" x2="22" y2="42" stroke="#818cf8" stroke-width="1.8"/>
      <line x1="6" y1="45" x2="22" y2="55" stroke="#818cf8" stroke-width="1.8"/>
    </g>

    <!-- Cloud / Data Node (Right) -->
    <g transform="translate(195, 80)">
      <path d="M 28 0 L 56 16 L 28 32 L 0 16 Z" fill="#1e293b"/>
      <path d="M 0 16 L 28 32 L 28 65 L 0 49 Z" fill="#0f172a"/>
      <path d="M 28 32 L 56 16 L 56 49 L 28 65 Z" fill="#090d16"/>
      <circle cx="38" cy="35" r="2" fill="#38bdf8"/>
      <circle cx="46" cy="30" r="2" fill="#10b981"/>
    </g>

    <!-- Glowing Bus Interconnect Lines -->
    <path d="M 88 123 L 140 148 L 210 130" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <circle cx="140" cy="148" r="3" fill="#38bdf8"/>
    <circle cx="88" cy="123" r="3" fill="#818cf8"/>
    <circle cx="210" cy="130" r="3" fill="#38bdf8"/>
  </g>

  <!-- Technical Overlay HUD Elements -->
  <g transform="translate(24, 24)">
    <rect width="125" height="24" rx="12" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.28)" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#38bdf8"/>
    <text x="24" y="15.5" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="10" font-weight="700" fill="#7dd3fc" letter-spacing="0.08em">SIMULATION LAB</text>
  </g>

  <!-- Project Title and Tag at Bottom -->
  <g transform="translate(24, 290)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      PROJECT: <tspan fill="#f1f5f9">IT-EMPIRE</tspan>
    </text>
    <text y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">
      Technology Enterprise &amp; Infrastructure Tycoon Simulation
    </text>
  </g>

  <!-- Blueprint Coordinates Watermark -->
  <text x="576" y="310" text-anchor="end" font-family="monospace" font-size="10" fill="#475569" letter-spacing="0.1em">
    SEC://ITE-SYS-2026
  </text>
</svg>

