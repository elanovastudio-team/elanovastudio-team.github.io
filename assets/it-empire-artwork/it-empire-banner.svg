<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <!-- Background Gradient: Deep Tech Slate & Navy -->
    <linearGradient id="ite-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Subtle Circuit Matrix Pattern -->
    <pattern id="ite-dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#38BDF8" opacity="0.12"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.75" opacity="0.05"/>
    </pattern>

    <!-- Glowing Datacenter Radiance -->
    <radialGradient id="ite-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Server Rack Shaders -->
    <linearGradient id="rack-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="rack-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="rack-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="chart-green" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#ite-bg)"/>
  <rect width="1200" height="675" fill="url(#ite-dots)"/>
  <rect width="1200" height="675" fill="url(#ite-glow)"/>

  <!-- Left Side: Simulation Management HUD / Dashboard telemetry -->
  <g transform="translate(60, 200)">
    <!-- Metrics Panel 1: Revenue & Growth -->
    <rect width="280" height="130" rx="12" fill="#0B132B" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.08em">GLOBAL IT REVENUE</text>
    <text x="20" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="800" fill="#F8FAFC">$42.8M <tspan font-size="14" fill="#10B981" font-weight="700">+28.4%</tspan></text>
    
    <!-- Mini sparkline graph -->
    <path d="M 20 105 L 60 98 L 110 102 L 160 85 L 210 90 L 260 75" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <circle cx="260" cy="75" r="4" fill="#10B981"/>

    <!-- Metrics Panel 2: Cloud Infrastructure Clusters -->
    <g transform="translate(0, 150)">
      <rect width="280" height="130" rx="12" fill="#0B132B" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.08em">DATACENTER CAPACITY</text>
      <text x="20" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">99.98% <tspan font-size="13" fill="#38BDF8" font-weight="600">ONLINE</tspan></text>
      
      <!-- Cluster progress bars -->
      <rect x="20" y="85" width="240" height="8" rx="4" fill="#1E293B"/>
      <rect x="20" y="85" width="210" height="8" rx="4" fill="#38BDF8"/>
      <text x="20" y="112" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="10" fill="#64748B">3,420 / 3,500 Nodes Active &bull; Tier 4</text>
    </g>
  </g>

  <!-- Center-Right: High-Tech Isometric Datacenter Campus & Server Towers -->
  <g transform="translate(680, 220)">
    <!-- Base Platform Grid -->
    <path d="M 0 160 L 240 280 L 480 160 L 240 40 Z" fill="#0C1425" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
    <path d="M 120 100 L 360 220 M 120 220 L 360 100" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

    <!-- Central Mega Server Blade 1 (Primary Tower) -->
    <g transform="translate(180, 20)">
      <!-- Top -->
      <path d="M 60 0 L 120 30 L 60 60 L 0 30 Z" fill="url(#rack-top)"/>
      <!-- Left side -->
      <path d="M 0 30 L 60 60 L 60 220 L 0 190 Z" fill="url(#rack-left)"/>
      <!-- Right side -->
      <path d="M 60 60 L 120 30 L 120 190 L 60 220 Z" fill="url(#rack-right)"/>
      
      <!-- Glowing Blade Server Slots -->
      <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="65" x2="48" y2="83"/>
        <line x1="12" y1="90" x2="48" y2="108"/>
        <line x1="12" y1="115" x2="48" y2="133"/>
        <line x1="12" y1="140" x2="48" y2="158"/>
        <line x1="12" y1="165" x2="48" y2="183"/>
      </g>
      
      <!-- Server Activity LED Indicators -->
      <g>
        <circle cx="80" cy="70" r="3" fill="#10B981"/>
        <circle cx="95" cy="62" r="3" fill="#38BDF8"/>
        <circle cx="80" cy="95" r="3" fill="#10B981"/>
        <circle cx="95" cy="87" r="3" fill="#38BDF8"/>
        <circle cx="80" cy="120" r="3" fill="#10B981"/>
        <circle cx="95" cy="112" r="3" fill="#F59E0B"/>
        <circle cx="80" cy="145" r="3" fill="#10B981"/>
        <circle cx="95" cy="137" r="3" fill="#38BDF8"/>
      </g>
    </g>

    <!-- Server Blade 2 (Left Wing) -->
    <g transform="translate(70, 75)">
      <path d="M 50 0 L 100 25 L 50 50 L 0 25 Z" fill="url(#rack-top)"/>
      <path d="M 0 25 L 50 50 L 50 170 L 0 145 Z" fill="url(#rack-left)"/>
      <path d="M 50 50 L 100 25 L 100 145 L 50 170 Z" fill="url(#rack-right)"/>
      <line x1="10" y1="55" x2="40" y2="70" stroke="#818CF8" stroke-width="2"/>
      <line x1="10" y1="75" x2="40" y2="90" stroke="#818CF8" stroke-width="2"/>
      <line x1="10" y1="95" x2="40" y2="110" stroke="#10B981" stroke-width="2"/>
      <line x1="10" y1="115" x2="40" y2="130" stroke="#818CF8" stroke-width="2"/>
    </g>

    <!-- Server Blade 3 (Right Wing) -->
    <g transform="translate(290, 80)">
      <path d="M 50 0 L 100 25 L 50 50 L 0 25 Z" fill="url(#rack-top)"/>
      <path d="M 0 25 L 50 50 L 50 160 L 0 135 Z" fill="url(#rack-left)"/>
      <path d="M 50 50 L 100 25 L 100 135 L 50 160 Z" fill="url(#rack-right)"/>
      <circle cx="70" cy="55" r="3" fill="#38BDF8"/>
      <circle cx="85" cy="47" r="3" fill="#10B981"/>
      <circle cx="70" cy="80" r="3" fill="#38BDF8"/>
      <circle cx="85" cy="72" r="3" fill="#38BDF8"/>
    </g>

    <!-- Optical Fiber Bus Connections -->
    <path d="M 120 220 L 240 280 L 340 230" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="120" cy="220" r="5" fill="#00E5FF"/>
    <circle cx="240" cy="280" r="6" fill="#10B981"/>
    <circle cx="340" cy="230" r="5" fill="#00E5FF"/>
  </g>

  <!-- Top HUD Badges & Title -->
  <g transform="translate(60, 55)">
    <!-- Studio Tag -->
    <rect width="210" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="5" fill="#38BDF8"/>
    <text x="32" y="21" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="12" font-weight="700" fill="#7DD3FC" letter-spacing="0.1em">SIMULATION // TYCOON</text>

    <!-- Big Bold Game Wordmark -->
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-0.03em">
      IT-<tspan fill="#38BDF8">EMPIRE</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#94A3B8">
      Building, Expanding &amp; Managing a Technology Enterprise
    </text>
  </g>

  <!-- Right Status Badge (IN DEVELOPMENT) -->
  <g transform="translate(970, 55)">
    <rect width="170" height="38" rx="19" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="22" cy="19" r="6" fill="#38BDF8"/>
    <text x="38" y="24" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="12" font-weight="800" fill="#7DD3FC" letter-spacing="0.08em">IN DEVELOPMENT</text>
  </g>

  <!-- Bottom Left Spec Card -->
  <g transform="translate(60, 580)">
    <rect width="360" height="45" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2"/>
    <text x="18" y="28" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">
      GENRE: <tspan fill="#38BDF8">BUSINESS TYCOON</tspan> &bull; ARCHITECTURE LAB
    </text>
  </g>
</svg>

