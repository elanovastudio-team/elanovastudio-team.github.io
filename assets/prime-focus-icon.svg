<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="pf-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="pf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="160" height="160" rx="38" fill="url(#pf-bg)"/>
  <rect x="1" y="1" width="158" height="158" rx="37" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  
  <!-- Subtle Internal Glow -->
  <circle cx="80" cy="80" r="60" fill="url(#pf-glow)"/>

  <!-- Dial Outer Track -->
  <circle cx="80" cy="80" r="50" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6"/>

  <!-- Dial Active Progress Arc (75% completed focus session) -->
  <circle cx="80" cy="80" r="50" 
          stroke="url(#pf-ring)" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-dasharray="314.16" 
          stroke-dashoffset="78.5" 
          transform="rotate(-90 80 80)"/>

  <!-- Precision Minute Markers -->
  <g stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.8" stroke-linecap="round">
    <line x1="80" y1="36" x2="80" y2="41"/>
    <line x1="80" y1="119" x2="80" y2="124"/>
    <line x1="36" y1="80" x2="41" y2="80"/>
    <line x1="119" y1="80" x2="124" y2="80"/>
  </g>

  <!-- Inner Core Circle -->
  <circle cx="80" cy="80" r="30" fill="#0d111e" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- Minimalist Focus Target Symbol / PF Monogram -->
  <path d="M72 68 V92 M72 68 H83 C86.3 68 89 70.7 89 74 C89 77.3 86.3 80 83 80 H72" 
        stroke="url(#pf-ring)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Active Focus Beacon Pulse -->
  <circle cx="80" cy="30" r="4.5" fill="#38bdf8"/>
  <circle cx="80" cy="30" r="8" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
</svg>

